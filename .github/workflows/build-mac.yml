name: build-mac

# 在 GitHub 的 macOS runner 上编译 DSHDesktop，产出未签名的 .app（打 DMG）。
# 目标：Intel（x86_64）与 Apple Silicon（arm64）都能跑 —— 由 ARCHS 决定通用二进制。
# 触发：Actions 页面手动 Run workflow，或 push 到 macos/**。
# 产物：Artifacts → DSHDesktop-mac → DSHDesktop-mac.dmg

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers

      - name: Ensure XcodeGen
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen || true
          xcodegen --version

      - name: Generate project
        working-directory: macos
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project DSHDesktop.xcodeproj -list

      - name: Build (unsigned, universal)
        working-directory: macos
        run: |
          set +e
          xcodebuild \
            -project DSHDesktop.xcodeproj \
            -scheme DSHDesktop \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CURRENT_PROJECT_VERSION="$(git rev-parse --short=7 HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild exited with $status"
            grep -E "error: " build.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Keep build log
        if: always()
        # 这一步只是留档，失败不应该中断整个流程
        # （GitHub 的 artifact 服务偶发超时，曾因此把打包步骤跳过）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: macos/build.log
          if-no-files-found: ignore
          retention-days: 7

      # 用 DMG 而不是 zip：zip 对中文文件名需要 UTF-8 标志位，
      # ditto/zip 在部分情况下不写这个标志，解压出来会变成乱码目录名。
      # hdiutil 走 HFS+/APFS，文件名原生支持 Unicode，不会出错。
      - name: Package DMG
        working-directory: macos
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/DSHDesktop.app"
          if [ ! -d "$APP" ]; then
            echo "app bundle missing; products tree:"
            find build/Build/Products -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi
          echo "--- bundle id ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" || true
          echo "--- architectures (必须是 x86_64 + arm64) ---"
          lipo -info "$APP/Contents/MacOS/DSHDesktop" || true
          echo "--- 校验 x86_64 确实存在 ---"
          lipo -archs "$APP/Contents/MacOS/DSHDesktop" | grep -q x86_64 || {
            echo "::error::产物里没有 x86_64，Intel Mac 装不上"
            exit 1
          }
          # 组装 DMG 内容：改名后的 app + 指向「应用程序」的快捷方式
          STAGE="stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/天機系統.app"
          ln -s /Applications "$STAGE/Applications"
          ls -la "$STAGE"
          rm -f DSHDesktop-mac.dmg
          hdiutil create -volname "天機系統" -srcfolder "$STAGE" -ov -format UDZO DSHDesktop-mac.dmg
          ls -lh DSHDesktop-mac.dmg
          shasum -a 256 DSHDesktop-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DSHDesktop-mac
          path: macos/DSHDesktop-mac.dmg
          if-no-files-found: error
          retention-days: 30
