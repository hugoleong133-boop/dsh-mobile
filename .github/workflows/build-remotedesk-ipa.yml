name: build-remotedesk-ipa

# 在 GitHub macOS runner 上编译 RemoteDesk iOS 客户端，并用仓库 secrets 里的
# 证书（RD_P12_BASE64 / RD_P12_PASSWORD / RD_PROV_BASE64）签名，产出已签名 IPA。
# 触发：Actions 页面手动 Run，或 push 到 ios/RemoteDeskClient/** 与本 workflow。
# 产物：Artifacts → RemoteDeskClient-signed → RemoteDeskClient.ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/RemoteDeskClient/**'
      - 'ios/remotedesk-project.yml'
      - '.github/workflows/build-remotedesk-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          command -v xcodegen || echo "xcodegen not preinstalled"

      - name: Ensure XcodeGen
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen || true
          xcodegen --version

      - name: Generate project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec remotedesk-project.yml
          xcodebuild -project RemoteDeskClient.xcodeproj -list

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set +e
          xcodebuild \
            -project RemoteDeskClient.xcodeproj \
            -scheme RemoteDeskClient \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild exited with $status"
            grep -E "error: " build.log | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Keep build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-remotedesk
          path: ios/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Decode signing material
        working-directory: ios
        run: |
          set -euo pipefail
          echo "${{ secrets.RD_P12_BASE64 }}" | base64 -d > Hugo-ipad.p12
          echo "${{ secrets.RD_PROV_BASE64 }}" | base64 -d > Hugo-ipad.mobileprovision
          ls -la Hugo-ipad.p12 Hugo-ipad.mobileprovision

      - name: Sign IPA
        working-directory: ios
        env:
          P12_PASSWORD: ${{ secrets.RD_P12_PASSWORD }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ ! -d "$APP" ]; then
            echo "app bundle missing:"
            find build/Build/Products -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi

          # 1. 从 provision 提取 entitlements
          security cms -D -i Hugo-ipad.mobileprovision > prov.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' prov.plist > entitlements.plist
          echo "--- entitlements ---"
          cat entitlements.plist

          # 2. 创建临时 keychain 并导入证书
          KEYCHAIN=sign-$(date +%s).keychain
          KEYCHAIN_PASS=signing$(date +%s)Xy
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          security import Hugo-ipad.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign 2>&1 | tee import.log
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null 2>&1
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 3. 找签名身份（完整输出用于诊断）
          echo "--- find-identity ---"
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          echo "-------------------"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"iPhone[^"]*"' | head -1 | tr -d '"')
          echo "签名身份: [$IDENTITY]"
          if [ -z "$IDENTITY" ]; then
            echo "::error::找不到签名身份（见上方 find-identity 输出）"
            exit 1
          fi

          # 4. 嵌入 provisioning profile
          cp Hugo-ipad.mobileprovision "$APP/embedded.mobileprovision"

          # 5. codesign 重签（替换旧签名）
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign "$IDENTITY" --entitlements entitlements.plist \
            --timestamp=none "$APP"

          # 6. 验证
          codesign --verify --deep "$APP" && echo "签名验证通过"
          codesign -dvv "$APP" 2>&1 | head -20 || true

          # 7. 清理 keychain
          security delete-keychain "$KEYCHAIN" || true

      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          lipo -info "$APP/RemoteDesk" || true
          rm -rf Payload RemoteDeskClient.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RemoteDeskClient.ipa Payload
          ls -lh RemoteDeskClient.ipa
          shasum -a 256 RemoteDeskClient.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDeskClient-signed
          path: ios/RemoteDeskClient.ipa
          if-no-files-found: error
          retention-days: 30
