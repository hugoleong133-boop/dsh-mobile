name: RemoteDeskClient
options:
  bundleIdPrefix: local.rd
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # 证书 provisioning profile 匹配的 Bundle ID（Hugo·ipad(多开)）
    PRODUCT_BUNDLE_IDENTIFIER: app.eggplant7110.sagittarius1813
    PRODUCT_NAME: RemoteDesk
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  RemoteDeskClient:
    type: application
    platform: iOS
    sources:
      - path: RemoteDeskClient
        excludes:
          - "Info.plist"
          - "RemoteDeskClient.entitlements"
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: RemoteDeskClient/Info.plist

schemes:
  RemoteDeskClient:
    build:
      targets:
        RemoteDeskClient: all
    run:
      config: Release
    archive:
      config: Release
