name: build-ipa

# 在 GitHub 的 macOS runner 上编译 DSHMobile，产出未签名 IPA。
# 触发：仓库 Actions 页面手动 Run workflow，或 push 到 ios/**。
# 产物：Artifacts → DSHMobile-unsigned → DSHMobile-unsigned.ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          which xcodegen || echo "xcodegen not preinstalled"

      - name: Ensure XcodeGen
        run: |
          # runner 镜像大多已带 xcodegen；没有才装，装失败也不中断，后面报错更清楚
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen || true
          xcodegen --version

      - name: Generate project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project DSHMobile.xcodeproj -list

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set +e
          xcodebuild \
            -project DSHMobile.xcodeproj \
            -scheme DSHMobile \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="$(git rev-parse --short=7 HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild exited with $status"
            grep -E "error: " build.log | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Keep build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DSHMobile.app"
          if [ ! -d "$APP" ]; then
            echo "app bundle missing; products tree:"
            find build/Build/Products -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          lipo -info "$APP/DSHMobile" || true
          rm -rf Payload DSHMobile-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry DSHMobile-unsigned.ipa Payload
          ls -lh DSHMobile-unsigned.ipa
          shasum -a 256 DSHMobile-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DSHMobile-unsigned
          path: ios/DSHMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
