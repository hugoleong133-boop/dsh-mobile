# dsh-mobile 服务器中转 · nginx 反向代理
#
# 拓扑：
#   公司电脑  ──ssh -R──▶  服务器 127.0.0.1:8765  ──nginx──▶  https://dsh.你的域名.com
#   手机      ──https───▶  服务器 443
#
# 为什么代理不部署在服务器上：
#   dsh-mobile 必须读公司电脑上的 .credentials.yaml（DSH 浏览器的签名密钥），
#   并且要访问 127.0.0.1 上的 DSH。所以它只能待在那台电脑，服务器只负责透传。
#
# 放到 /etc/nginx/conf.d/dsh.conf，替换 dsh.example.com 与证书路径。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 配对接口单独限速：公网上这一层是必要的，代理内部另有 PIN 锁定
limit_req_zone $binary_remote_addr zone=dsh_pair:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name dsh.example.com;

    # certbot 校验用；证书配好后会 301
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dsh.example.com;

    ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 这个服务握着 DSH 的 owner 权限，别让搜索引擎碰到
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---------------------------------------------------------------- 可选加固
    # 打开任意一条都能再加一层。按需取消注释：
    #
    # 1) 只允许你的固定 IP / 网段访问（家宽 IP 变动时会把自己关在外面）
    # allow 203.0.113.0/24;
    # deny  all;
    #
    # 2) HTTP Basic 认证，和 PIN 叠加成两道
    # auth_basic           "DSH";
    # auth_basic_user_file /etc/nginx/.htpasswd-dsh;
    #   生成：htpasswd -c /etc/nginx/.htpasswd-dsh 你的用户名
    #
    # 3) 客户端证书（mTLS），最严，手机需装描述文件
    # ssl_client_certificate /etc/nginx/dsh-ca.pem;
    # ssl_verify_client      on;
    #
    # 4) 回环过来的流量只信任本机转发的 X-Forwarded-For
    # ----------------------------------------------------------------

    # 配对入口：限速，防止 PIN 被爆破
    location = /__m/pin {
        limit_req zone=dsh_pair burst=3 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # ?k=<pin> 也走这条路，同样限速
        limit_req zone=dsh_pair burst=5 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # WebSocket：DSH 的实时进度走 /api/remote.mux
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆盖而不是追加：避免客户端伪造 X-Forwarded-For 绕过限速
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式输出 / 长任务：别让 nginx 中途掐断，也别缓冲
        proxy_buffering      off;
        proxy_cache          off;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        client_max_body_size 0;

        # 上传附件走的是同一路
        proxy_request_buffering off;
    }

    # 免认证的状态端点，方便从外网判断是哪一头挂了
    location = /__m/status {
        proxy_pass http://127.0.0.1:8765/__m/status;
        proxy_set_header Host $host;
        access_log off;
    }
}
